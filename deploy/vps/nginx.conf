server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # curl -fsSL https://paymentsimulator.com/install | bash  -> serve the shell script
    location = /install {
        default_type text/x-shellscript;
        try_files /install.sh =404;
    }

    # ensure the compose file (fetched by install.sh) is served as plain yaml
    location = /docker-compose.yml {
        default_type text/yaml;
        try_files /docker-compose.yml =404;
    }

    # hashed build assets: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
